<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffe500">
  <meta name="robots" content="noindex,nofollow">
  <title>FleetTap · Connection needed</title>
  <link rel="icon" href="/assets/mark.svg">
  <link rel="stylesheet" href="/pwa.css">
</head>
<body class="offline-page">
  <main class="offline-card">
    <img src="/assets/icons/icon-192.png" width="80" height="80" alt="FleetTap">
    <h1>Connection needed</h1>
    <p>Connect to Wi-Fi or mobile data to open your garage workspace.</p>
    <p class="offline-note">FleetTap needs a connection to load records and save checks. If you have another FleetTap screen open, keep it open until you reconnect.</p>
    <button id="offline-retry" type="button">Try again</button>
    <p id="offline-status" role="status"></p>
  </main>
  <script src="/src/offline.js" defer></script>
</body>
</html>
